<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function(){
 const panel=document.getElementById('lv-chat-panel');
 const launcher=document.getElementById('lv-chat-launch');
 const box=document.getElementById('lv-chat-box');
 const form=document.getElementById('lv-chat-form');
 const error=document.getElementById('lv-chat-error');
 const nameInput=document.getElementById('lv-chat-name');
 const messageInput=document.getElementById('lv-chat-message');

 function showChat(){panel.classList.remove('lv-hidden');launcher.style.display='none';}
 function hideChat(){panel.classList.add('lv-hidden');launcher.style.display='block';}
 launcher.addEventListener('click',showChat);
 document.getElementById('lv-chat-hide').addEventListener('click',hideChat);

 const firebaseConfig={
  apiKey:"AIzaSyCNn3e71-xvmyZzrSL48VhjfxHwkDRnHok",
  authDomain:"radiolavozperu-e3ff2.firebaseapp.com",
  databaseURL:"https://radiolavozperu-e3ff2-default-rtdb.firebaseio.com",
  projectId:"radiolavozperu-e3ff2",
  storageBucket:"radiolavozperu-e3ff2.firebasestorage.app",
  messagingSenderId:"206416232216",
  appId:"1:206416232216:web:b1ae02acaef4ed11cf286d"
 };

 function addMessage(msg){
  const item=document.createElement('div');item.className='lv-chat-msg';
  const who=document.createElement('b');who.textContent=(msg.nombre||'Invitado')+': ';
  const body=document.createElement('span');body.textContent=msg.mensaje||'';
  item.append(who,body);box.appendChild(item);
 }
 function initChat(){
  if(!window.firebase || !firebase.database){error.textContent='No se pudo cargar Firebase.';return;}
  try{
   if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
   const db=firebase.database().ref('mensajes_chat');
   db.limitToLast(30).on('value',snapshot=>{
    box.replaceChildren();
    if(!snapshot.exists()){
     const empty=document.createElement('div');empty.textContent='Sé el primero en escribir.';
     empty.style.cssText='color:#8b9eb7;font-size:11px;text-align:center;margin:auto';
     box.appendChild(empty);return;
    }
    const messages=[];snapshot.forEach(child=>messages.push(child.val()||{}));
    messages.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(addMessage);
    box.scrollTop=box.scrollHeight;
   },()=>{error.textContent='No se pudo leer el chat. Revisa las reglas de Firebase.';});
   form.addEventListener('submit',async e=>{
    e.preventDefault();error.textContent='';
    const nombre=nameInput.value.trim(),mensaje=messageInput.value.trim();
    if(!nombre||!mensaje)return;
    const submit=form.querySelector('button[type="submit"]');submit.disabled=true;
    try{
     await db.push({nombre:nombre,mensaje:mensaje,timestamp:Date.now()});
     messageInput.value='';messageInput.focus();
    }catch(err){error.textContent='No se pudo enviar. Revisa la conexión y los permisos de Firebase.';}
    finally{submit.disabled=false;}
   });
  }catch(err){error.textContent='Error al iniciar el chat de Firebase.';}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initChat,{once:true});
 else initChat();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
 "use strict";
 const tvPanel=document.getElementById('lv-tv-panel');
 const tvLaunch=document.getElementById('lv-tv-launch');
 const tvVideo=document.getElementById('lv-tv-video');
 const tvIframeContainer=document.getElementById('lv-tv-iframe-container');
 const tvIframe=document.getElementById('lv-tv-iframe');
 const tvStatus=document.getElementById('lv-tv-status');
 const tabWeb=document.getElementById('tab-tv-web');
 const tabHls=document.getElementById('tab-tv-hls');
 const tvUrlWeb="https://ssh101.com/securelive/index.php?id=bandera";
 const tvUrlHls="https://lbgo.bozztv.com/ssh101/ssh101/bandera/chunks.m3u8?lb_backend_hint=7";
 let hlsInstance=null;

 function openTv(){
  tvPanel.classList.remove('lv-hidden');
  tvLaunch.style.display='none';
  if(!tvIframe.src) tvIframe.src=tvUrlWeb;
 }
 function closeTv(){
  tvPanel.classList.add('lv-hidden');
  tvLaunch.style.display='block';
  if(tvVideo) { tvVideo.pause(); }
 }
 tvLaunch.addEventListener('click',openTv);
 document.getElementById('lv-tv-hide').addEventListener('click',closeTv);

 tabWeb.addEventListener('click',()=>{
  tabWeb.classList.add('active');
  tabHls.classList.remove('active');
  tvIframeContainer.style.display='block';
  tvVideo.style.display='none';
  tvVideo.pause();
  tvIframe.src=tvUrlWeb;
 });

 tabHls.addEventListener('click',()=>{
  tabHls.classList.add('active');
  tabWeb.classList.remove('active');
  tvIframeContainer.style.display='none';
  tvVideo.style.display='block';
  startHls();
 });

 function startHls(){
  if(tvVideo.canPlayType('application/vnd.apple.mpegurl')){
   tvVideo.src=tvUrlHls;
   tvVideo.play().catch(()=>{});
  }else if(window.Hls && Hls.isSupported()){
   if(hlsInstance){hlsInstance.destroy();hlsInstance=null;}
   hlsInstance=new Hls({enableWorker:true,lowLatencyMode:true});
   hlsInstance.loadSource(tvUrlHls);
   hlsInstance.attachMedia(tvVideo);
   hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{tvVideo.play().catch(()=>{});});
  }
 }
 tvVideo.addEventListener('playing',()=>{
  const span = tvStatus.querySelector('span');
  if(span) span.textContent='EN VIVO · Transmisión HLS Activa';
 });
})();
</script>

<script>
(function(){
 "use strict";
 const panel=document.getElementById('lv-radio-panel');
 const launcher=document.getElementById('lv-radio-launch');
 const player=document.getElementById('wp-radio-player');
 const title=document.getElementById('wp-radio-title');
 const cover=document.getElementById('wp-radio-cover');
 const statusEl=document.getElementById('wp-radio-status');
 const buttons=Array.from(document.querySelectorAll('#lv-radio-panel .btn-radio-item'));
 let queue=[],index=0,stationName='',watchdog=null;

 function setStatus(t){statusEl.textContent=t;}
 function show(){panel.classList.remove('lv-hidden');launcher.style.display='none';}
 function hide(){panel.classList.add('lv-hidden');launcher.style.display='block';}
 launcher.addEventListener('click',show);
 document.getElementById('lv-radio-hide').addEventListener('click',hide);
 function clearWatchdog(){if(watchdog){clearTimeout(watchdog);watchdog=null;}}
 function markActive(btn){
  buttons.forEach(b=>{b.style.borderColor='#333';b.style.background='#1e1e1e';});
  if(btn){btn.style.borderColor='#00e676';btn.style.background='#1f3d2b';}
 }
 function tryNext(){
  clearWatchdog();
  if(index>=queue.length){
   player.pause();player.removeAttribute('src');player.load();
   setStatus('No se pudo reproducir "'+stationName+'". Reintenta en un momento.');
   return;
  }
  const src=queue[index++];
  setStatus('Conectando a '+stationName+'...');
  player.src=src;player.load();
  watchdog=setTimeout(()=>{watchdog=null;setStatus('Señal lenta, probando otra salida...');tryNext();},9000);
  const p=player.play();if(p&&p.catch)p.catch(()=>tryNext());
 }
 function playStation(url,name,image,btn){
  const base=url.replace(/\.mp3$/i,'');
  stationName=name;queue=[base,base+'.mp3',base,base+'.mp3'];index=0;
  title.textContent=name;cover.src=image;markActive(btn);setStatus('Iniciando '+name+'...');
  tryNext();
 }
 function sameStation(url){const base=url.replace(/\.mp3$/i,'');return !!player.currentSrc&&player.currentSrc.indexOf(base)!==-1;}
 buttons.forEach(btn=>btn.addEventListener('click',()=>{
  const url=btn.dataset.url,name=btn.dataset.nombre,image=btn.dataset.img;
  if(!player.paused&&sameStation(url)){player.pause();clearWatchdog();setStatus('Pausado: '+name);return;}
  playStation(url,name,image,btn);
 }));
 player.addEventListener('playing',()=>{clearWatchdog();setStatus('Reproduciendo: '+stationName);});
 player.addEventListener('waiting',()=>setStatus('Recibiendo señal...'));
 player.addEventListener('error',()=>{clearWatchdog();setStatus('Error de señal, probando otra salida...');tryNext();});
})();
</script>
